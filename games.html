<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Vanguard Arena: Overdrive</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--fg:#e8f1ff;--acc:#39d0ff;--hp:#ff5470;--panel:rgba(8,12,20,.55)}
html,body{height:100%;margin:0;background:#0b0f14;color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden;user-select:none}
canvas{display:block;position:fixed;inset:0}
#hud>*{position:fixed;pointer-events:none}
#top{top:calc(12px + env(safe-area-inset-top,0px));left:14px;background:var(--panel);padding:6px 12px;border-radius:8px}
#fps{top:calc(12px + env(safe-area-inset-top,0px));right:14px;opacity:.7}
#cross{top:50%;left:50%;width:6px;height:6px;margin:-3px;border:2px solid var(--acc);border-radius:50%;box-shadow:0 0 8px var(--acc)}
#hm{top:50%;left:50%;width:26px;height:26px;margin:-13px;border:2px solid #fff;opacity:0;transform:rotate(45deg);box-shadow:0 0 14px #fff}
#msg{top:22%;width:100%;text-align:center;font-size:32px;font-weight:800;letter-spacing:.12em;opacity:0;text-shadow:0 0 18px rgba(57,208,255,.8),0 2px 12px #000}
#bars{bottom:calc(18px + env(safe-area-inset-bottom,0px));left:16px;width:270px}
.bar{height:12px;background:var(--panel);border-radius:6px;margin-top:6px;overflow:hidden;box-shadow:inset 0 0 6px #000}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#39d0ff,#8b5cf6);transition:width .15s}
.bar.hp i{background:linear-gradient(90deg,#ff5470,#ff9f43)}
#wp{bottom:calc(18px + env(safe-area-inset-bottom,0px));right:18px;text-align:right;background:var(--panel);padding:8px 14px;border-radius:8px}
#am{font-size:28px;font-weight:700}
#vig{inset:0;box-shadow:inset 0 0 160px 50px rgba(255,32,64,.85);opacity:0}
#glowvig{inset:0;box-shadow:inset 0 0 200px 20px rgba(0,0,0,.45)}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(5,8,14,.78);cursor:pointer}
#ov h1{letter-spacing:.22em;margin:0 0 8px;font-size:34px;text-shadow:0 0 24px rgba(57,208,255,.6)}
.s{opacity:.7;max-width:440px}
</style></head><body>
<div id="hud">
<div id="top"><b id="wave">Wave 1</b> · <span id="score">0</span></div><div id="fps"></div>
<div id="cross"></div><div id="hm"></div><div id="msg"></div>
<div id="bars"><div class="bar"><i id="sh"></i></div><div class="bar hp"><i id="hp"></i></div></div>
<div id="wp"><div id="wn"></div><div id="am"></div><div id="gr"></div></div>
<div id="glowvig"></div><div id="vig"></div>
</div>
<div id="ov"><div><h1>VANGUARD ARENA: OVERDRIVE</h1><p id="ovp">Click to play</p>
<p class="s">WASD move · Shift sprint · Space jump · Click fire · R reload · G grenade · 1/2/Q switch weapon</p></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,400);cam.rotation.order='YXZ';scene.add(cam);
const ren=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);
ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFSoftShadowMap;
ren.outputEncoding=THREE.sRGBEncoding;ren.toneMapping=THREE.ACESFilmicToneMapping;ren.toneMappingExposure=1.05;
document.body.appendChild(ren.domElement);const canvas=ren.domElement;

/* ---- Sky dome with gradient + sun glow (shader) ---- */
const skyGeo=new THREE.SphereGeometry(340,32,20);
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,uniforms:{
 top:{value:new THREE.Color(0x1a3a6b)},mid:{value:new THREE.Color(0x8fb6d9)},bot:{value:new THREE.Color(0xd9c9a8)}},
 vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
 fragmentShader:'varying vec3 vP;uniform vec3 top,mid,bot;void main(){float h=normalize(vP).y;vec3 c=h>0.?mix(mid,top,pow(min(h*1.6,1.),.7)):mix(mid,bot,min(-h*3.,1.));gl_FragColor=vec4(c,1.);}'});
scene.add(new THREE.Mesh(skyGeo,skyMat));
scene.fog=new THREE.FogExp2(0x9db8d4,.008);

/* ---- Lights: warm sun, cool hemi fill, subtle rim ---- */
scene.add(new THREE.HemisphereLight(0xbfd9ff,0x4a5230,.85));
const sun=new THREE.DirectionalLight(0xffe3b3,1.5);sun.position.set(70,100,40);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-80,right:80,top:80,bottom:-80,near:10,far:250});
sun.shadow.bias=-.0004;scene.add(sun);
const rim=new THREE.DirectionalLight(0x7a9fff,.35);rim.position.set(-60,40,-50);scene.add(rim);

function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(11);

/* ---- High-res ground: dirt noise + faint grid tint ---- */
const tc=document.createElement('canvas');tc.width=tc.height=512;const tx=tc.getContext('2d');
for(let i=0;i<14000;i++){const v=95+R()*55|0;tx.fillStyle=`rgb(${v-22},${v+4},${v-38})`;const s=1+R()*4;tx.fillRect(R()*512,R()*512,s,s)}
tx.strokeStyle='rgba(255,255,255,0.045)';tx.lineWidth=1;
for(let g=0;g<=512;g+=64){tx.beginPath();tx.moveTo(g,0);tx.lineTo(g,512);tx.moveTo(0,g);tx.lineTo(512,g);tx.stroke()}
const gt=new THREE.CanvasTexture(tc);gt.wrapS=gt.wrapT=THREE.RepeatWrapping;gt.repeat.set(30,30);gt.encoding=THREE.sRGBEncoding;gt.anisotropy=8;
const ground=new THREE.Mesh(new THREE.PlaneGeometry(440,440),new THREE.MeshStandardMaterial({map:gt,roughness:.92,metalness:.05}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

/* ---- Arena wall: dark metal + emissive ring band ---- */
const wallMat=new THREE.MeshStandardMaterial({color:0x27303e,metalness:.65,roughness:.4,side:THREE.BackSide});
const wall=new THREE.Mesh(new THREE.CylinderGeometry(64,64,16,64,1,true),wallMat);wall.position.y=8;wall.receiveShadow=true;scene.add(wall);
const bandMat=new THREE.MeshBasicMaterial({color:0x39d0ff});
const band=new THREE.Mesh(new THREE.CylinderGeometry(63.9,63.9,.5,64,1,true),bandMat);band.position.y=6.5;scene.add(band);

/* ---- Cover blocks: brushed metal + animated glow strips ---- */
const covers=[],boxes=[];
const cm=new THREE.MeshStandardMaterial({color:0x637080,roughness:.35,metalness:.75});
const glow=new THREE.MeshStandardMaterial({color:0x001418,emissive:0x39d0ff,emissiveIntensity:2.4});
const panelG=new THREE.BoxGeometry(1,1,1);
for(let i=0;i<18;i++){const a=R()*6.283,d=11+R()*42,w=3+R()*5,h=2+R()*4.5,l=3+R()*5;
 const m=new THREE.Mesh(panelG,cm);m.scale.set(w,h,l);m.position.set(Math.cos(a)*d,h/2,Math.sin(a)*d);m.castShadow=m.receiveShadow=true;
 // corner accents
 const acc=new THREE.Mesh(new THREE.BoxGeometry(w+.1,.18,l+.1),glow);acc.position.y=h/2-.15;m.add(acc);
 const acc2=new THREE.Mesh(new THREE.BoxGeometry(.18,h*.7,l+.1),glow);acc2.position.set(w/2-.09,-h*.1,0);m.add(acc2);
 scene.add(m);covers.push(m);boxes.push({x:m.position.x,z:m.position.z,hw:w/2,hl:l/2});}

/* ---- Floating light pylons for atmosphere ---- */
const pyl=[];
for(let i=0;i<6;i++){const a=i/6*6.283+0.4,d=50;
 const pm2=new THREE.Mesh(new THREE.CylinderGeometry(.5,.7,22,10),new THREE.MeshStandardMaterial({color:0x1b2330,metalness:.8,roughness:.3}));
 pm2.position.set(Math.cos(a)*d,11,Math.sin(a)*d);pm2.castShadow=true;
 const tip=new THREE.Mesh(new THREE.SphereGeometry(.9,14,10),new THREE.MeshStandardMaterial({color:0x001418,emissive:0xff5a1f,emissiveIntensity:2}));
 tip.position.y=11.5;pm2.add(tip);const pl=new THREE.PointLight(0xff7733,.8,40);pl.position.y=11.5;pm2.add(pl);
 scene.add(pm2);pyl.push({tip,ph:R()*6});}

/* ---- Clouds: soft billboard sprites ---- */
const cloudTexC=document.createElement('canvas');cloudTexC.width=cloudTexC.height=128;const cx=cloudTexC.getContext('2d');
const grd=cx.createRadialGradient(64,64,8,64,64,62);grd.addColorStop(0,'rgba(255,255,255,.85)');grd.addColorStop(1,'rgba(255,255,255,0)');
cx.fillStyle=grd;cx.fillRect(0,0,128,128);
const cloudTex=new THREE.CanvasTexture(cloudTexC);
for(let i=0;i<14;i++){const sm=new THREE.SpriteMaterial({map:cloudTex,transparent:true,opacity:.5,depthWrite:false});
 const s=new THREE.Sprite(sm);const a=R()*6.283,d=90+R()*140;s.position.set(Math.cos(a)*d,40+R()*50,Math.sin(a)*d);
 s.scale.set(60+R()*80,18+R()*22,1);scene.add(s);}

/* ---- State ---- */
const p=new THREE.Vector3(0,1.7,0),vel=new THREE.Vector3();let vy=0,yaw=0,pitch=0,onGround=true;
let shield=100,health=100,lastHit=-9,time=0,score=0,wave=0,dead=false,started=false,everLocked=false;
let firing=false,tap=false,fireCd=0,reloading=0,recoil=0,flash=0,cur=0,grenades=3,nextWave=2;
const keys={};const enemies=[],projs=[],nades=[],booms=[],tracers=[],sparks=[];
const W=[{n:'PULSE RIFLE',rate:.09,dmg:14,mag:32,spread:.012,auto:true,ammo:32,res:160,rl:1.5,z:1},
 {n:'SIDEARM',rate:.28,dmg:34,mag:12,spread:.004,auto:false,ammo:12,res:60,rl:1.1,z:.6}];

/* ---- Viewmodel: multi-part gun ---- */
const gun=new THREE.Group();
const gm=new THREE.MeshStandardMaterial({color:0x1b2330,metalness:.85,roughness:.25});
const gm2=new THREE.MeshStandardMaterial({color:0x2e3a4c,metalness:.7,roughness:.35});
const gb=new THREE.Mesh(new THREE.BoxGeometry(.11,.14,.7),gm);
const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.035,.045,.5,10),gm2);barrel.rotation.x=Math.PI/2;barrel.position.set(0,0,-.5);
const ga=new THREE.Mesh(new THREE.BoxGeometry(.05,.03,.5),glow);ga.position.set(0,.085,0);
const grip=new THREE.Mesh(new THREE.BoxGeometry(.08,.2,.1),gm2);grip.position.set(0,-.15,.15);grip.rotation.x=.3;
gun.add(gb,barrel,ga,grip);
gun.position.set(.28,-.26,-.55);cam.add(gun);
const mf=new THREE.PointLight(0x7be0ff,0,14);mf.position.set(.28,-.2,-1.3);cam.add(mf);
const flashSprite=new THREE.Sprite(new THREE.SpriteMaterial({map:cloudTex,color:0x9fe8ff,transparent:true,opacity:0,depthWrite:false}));
flashSprite.scale.set(.9,.9,1);flashSprite.position.set(.28,-.2,-1.1);cam.add(flashSprite);

/* ---- Audio ---- */
let ac;function beep(f,d,t,v){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=t;o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f*.4,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(ac.destination);o.start();o.stop(n+d)}catch(e){}}

/* ---- Enemies: ornate cores ---- */
const eg=new THREE.IcosahedronGeometry(.9,2),em=new THREE.MeshStandardMaterial({color:0x7c3aed,metalness:.75,roughness:.2,flatShading:true,emissive:0x2a0a4a,emissiveIntensity:.6});
const eyeG=new THREE.SphereGeometry(.26,16,12),eyeM=new THREE.MeshStandardMaterial({color:0x220008,emissive:0xff2d55,emissiveIntensity:3});
const ringG=new THREE.TorusGeometry(1.3,.055,10,40),ringM=new THREE.MeshStandardMaterial({color:0x111111,emissive:0x8b5cf6,emissiveIntensity:2});
const ring2G=new THREE.TorusGeometry(1.05,.04,8,36);
const pg=new THREE.SphereGeometry(.22,10,8),pm=new THREE.MeshBasicMaterial({color:0xff3355});
function spawnWave(){wave++;const n=3+wave*2;
 for(let i=0;i<n;i++){const g=new THREE.Group(),b=new THREE.Mesh(eg,em),e1=new THREE.Mesh(eyeG,eyeM),r=new THREE.Mesh(ringG,ringM),r2=new THREE.Mesh(ring2G,ringM);
  e1.position.z=.78;r.rotation.x=Math.PI/2;r2.rotation.y=Math.PI/3;g.add(b,e1,r,r2);g.traverse(o=>o.castShadow=true);
  const a=R()*6.283,d=46+R()*10;g.position.set(Math.cos(a)*d,3,Math.sin(a)*d);
  const e={g,hp:50+wave*6,cd:1+R()*2,t:R()*9,ph:R()*6.28,sw:.6+R(),spd:5+Math.min(wave,6)*.5,range:16+R()*10,h:2+R()*3};
  g.userData.enemy=e;scene.add(g);enemies.push(e)}
 msg('WAVE '+wave)}
function msg(t){const m=$('msg');m.textContent=t;m.style.opacity=1;m.style.transition='none';requestAnimationFrame(()=>{m.style.transition='opacity 2.2s .6s';m.style.opacity=0})}
function hurt(n){lastHit=time;$('vig').style.opacity=1;beep(120,.2,'sawtooth',.1);
 const s=Math.min(shield,n);shield-=s;health-=n-s;
 if(health<=0&&!dead){dead=true;document.exitPointerLock&&document.exitPointerLock();$('ovp').textContent=`Eliminated · wave ${wave} · score ${score} · click to restart`;$('ov').style.display='flex'}}
function sparksBurst(pos,color,n){for(let i=0;i<n;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:cloudTex,color:color,transparent:true,opacity:.9,depthWrite:false}));
 s.position.copy(pos);s.scale.setScalar(.3+Math.random()*.5);scene.add(s);
 sparks.push({s,v:new THREE.Vector3((Math.random()-.5)*9,Math.random()*7,(Math.random()-.5)*9),t:.5+Math.random()*.4})}}
function boom(pos,r){const m=new THREE.Mesh(new THREE.SphereGeometry(1,20,14),new THREE.MeshBasicMaterial({color:0xffa040,transparent:true,opacity:.9}));
 m.position.copy(pos);scene.add(m);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(1,.14,8,40),new THREE.MeshBasicMaterial({color:0xffd080,transparent:true,opacity:.8}));
 ring.position.copy(pos);ring.rotation.x=Math.PI/2;scene.add(ring);
 booms.push({m,t:0,r,ring});sparksBurst(pos,0xffa040,10)}
function kill(e){scene.remove(e.g);enemies.splice(enemies.indexOf(e),1);score+=100;boom(e.g.position,2.5);beep(90,.35,'sawtooth',.12)}
function findEnemy(o){while(o){if(o.userData.enemy)return o.userData.enemy;o=o.parent}}

/* ---- Weapons ---- */
const ray=new THREE.Raycaster(),v1=new THREE.Vector3(),v2=new THREE.Vector3();
function reload(){const w=W[cur];if(reloading>0||w.ammo>=w.mag||w.res<=0)return;reloading=w.rl}
function fire(){const w=W[cur];if(reloading>0||fireCd>0)return;if(w.ammo<=0){reload();return}
 w.ammo--;fireCd=w.rate;recoil=1;flash=.05;beep(cur?300:520,.07,'square',.07);
 ray.setFromCamera({x:0,y:0},cam);const d=ray.ray.direction;d.x+=(Math.random()-.5)*w.spread*2;d.y+=(Math.random()-.5)*w.spread*2;d.normalize();
 const t=covers.concat(enemies.map(e=>e.g)),h=ray.intersectObjects(t,true)[0];
 const end=h?h.point:ray.ray.origin.clone().addScaledVector(d,120),st=cam.localToWorld(new THREE.Vector3(.28,-.22,-1));
 const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints([st,end]),new THREE.LineBasicMaterial({color:cur?0xffb347:0x7be0ff,transparent:true,opacity:.9}));scene.add(ln);tracers.push({ln,t:.07});
 if(h&&h.object.material!==cm&&!findEnemy(h.object))sparksBurst(h.point,0x9fe8ff,4);
 const e=h&&findEnemy(h.object);if(e){e.hp-=w.dmg;sparksBurst(h.point,0xff5a9f,5);const m=$('hm');m.style.transition='none';m.style.opacity=1;requestAnimationFrame(()=>{m.style.transition='opacity .25s';m.style.opacity=0});if(e.hp<=0)kill(e)}}
function throwNade(){if(grenades<=0)return;grenades--;const m=new THREE.Mesh(new THREE.SphereGeometry(.16,12,10),new THREE.MeshStandardMaterial({color:0x222222,emissive:0xff5a1f,emissiveIntensity:1.6}));
 cam.getWorldDirection(v1);m.position.copy(p).addScaledVector(v1,.8);scene.add(m);nades.push({m,v:v1.clone().multiplyScalar(17).add(new THREE.Vector3(0,4,0)),t:0})}
function blast(pos){boom(pos,9);beep(60,.6,'sawtooth',.2);
 for(const e of enemies.slice()){const d=e.g.position.distanceTo(pos);if(d<9){e.hp-=150*(1-d/9);if(e.hp<=0)kill(e)}}
 const d=p.distanceTo(pos);if(d<6)hurt(45*(1-d/6))}

/* ---- Input ---- */
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')reload();if(e.code==='KeyG')throwNade();if(e.code==='Digit1'){cur=0;reloading=0}if(e.code==='Digit2'){cur=1;reloading=0}if(e.code==='KeyQ'){cur^=1;reloading=0}});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('mousedown',e=>{if(e.button===0){firing=true;tap=true}});addEventListener('mouseup',()=>firing=false);
addEventListener('mousemove',e=>{if(!started||dead||$('ov').style.display!=='none')return;if(document.pointerLockElement===canvas||e.buttons){yaw-=e.movementX*.0022;pitch=Math.max(-1.5,Math.min(1.5,pitch-e.movementY*.0022))}});
$('ov').onclick=()=>{if(dead)return location.reload();started=true;$('ov').style.display='none';try{const r=canvas.requestPointerLock();r&&r.catch&&r.catch(()=>{})}catch(e){}};
document.addEventListener('pointerlockchange',()=>{const l=document.pointerLockElement===canvas;if(l)everLocked=true;if(!l&&everLocked&&!dead){$('ovp').textContent='Paused · click to resume';$('ov').style.display='flex'}});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});

/* ---- Loop ---- */
const clock=new THREE.Clock();let fpsA=0,fpsN=0;
function update(dt){time+=dt;
 const f=(keys.KeyW?1:0)-(keys.KeyS?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0),sp=keys.ShiftLeft?11:7,sn=Math.sin(yaw),cs=Math.cos(yaw);
 let wx=-sn*f+cs*s,wz=-cs*f-sn*s;const l=Math.hypot(wx,wz);if(l>1){wx/=l;wz/=l}
 const k=Math.min(1,dt*12);vel.x+=(wx*sp-vel.x)*k;vel.z+=(wz*sp-vel.z)*k;p.x+=vel.x*dt;p.z+=vel.z*dt;
 if(onGround&&keys.Space){vy=7.5;onGround=false}vy-=22*dt;p.y+=vy*dt;if(p.y<=1.7){p.y=1.7;vy=0;onGround=true}
 for(const b of boxes){const dx=p.x-b.x,dz=p.z-b.z,ox=b.hw+.5-Math.abs(dx),oz=b.hl+.5-Math.abs(dz);if(ox>0&&oz>0){if(ox<oz)p.x+=Math.sign(dx)*ox;else p.z+=Math.sign(dz)*oz}}
 const rr=Math.hypot(p.x,p.z);if(rr>60){p.x*=60/rr;p.z*=60/rr}
 if(time-lastHit>4&&shield<100)shield=Math.min(100,shield+30*dt);
 fireCd-=dt;if(reloading>0){reloading-=dt;if(reloading<=0){const w=W[cur],n=Math.min(w.mag-w.ammo,w.res);w.ammo+=n;w.res-=n}}
 if(firing&&(W[cur].auto||tap))fire();tap=false;
 // enemy AI
 for(const e of enemies){const g=e.g,to=v1.set(p.x-g.position.x,0,p.z-g.position.z),d=to.length();to.normalize();
  const m=d>e.range?1:d<e.range-5?-.8:0,sw=Math.sin((e.t+=dt)*e.sw+e.ph);
  g.position.x+=(to.x*m-to.z*sw*.8)*e.spd*dt;g.position.z+=(to.z*m+to.x*sw*.8)*e.spd*dt;
  const q=Math.hypot(g.position.x,g.position.z);if(q>58){g.position.x*=58/q;g.position.z*=58/q}
  g.position.y=e.h+Math.sin(e.t*2+e.ph)*.4;g.lookAt(p.x,g.position.y,p.z);
  g.children[2].rotation.z+=dt*2;g.children[3].rotation.x+=dt*3; // spin rings
  if((e.cd-=dt)<=0&&d<50){e.cd=1.2+Math.random()*1.3;const b=new THREE.Mesh(pg,pm);b.position.copy(g.position);scene.add(b);
   projs.push({m:b,v:v2.set(p.x-g.position.x+(Math.random()-.5)*2,p.y-.4-g.position.y,p.z-g.position.z+(Math.random()-.5)*2).normalize().multiplyScalar(21).clone(),t:5})}}
 for(let i=projs.length-1;i>=0;i--){const q=projs[i];q.m.position.addScaledVector(q.v,dt);q.t-=dt;
  if(q.m.position.distanceTo(p)<.9){hurt(12);q.t=0}if(q.t<=0||q.m.position.y<0){scene.remove(q.m);projs.splice(i,1)}}
 for(let i=nades.length-1;i>=0;i--){const n=nades[i];n.t+=dt;n.v.y-=20*dt;n.m.position.addScaledVector(n.v,dt);
  if(n.m.position.y<.16){n.m.position.y=.16;n.v.y*=-.4;n.v.x*=.7;n.v.z*=.7}
  if(n.t>1.6){blast(n.m.position);scene.remove(n.m);nades.splice(i,1)}}
 for(let i=booms.length-1;i>=0;i--){const b=booms[i];b.t+=dt*2.5;b.m.scale.setScalar(.3+b.r*Math.min(1,b.t*1.5)*.5);b.m.material.opacity=Math.max(0,.9-b.t);
  b.ring.scale.setScalar(1+b.t*b.r*2.2);b.ring.material.opacity=Math.max(0,.8-b.t);
  if(b.t>=1){scene.remove(b.m);scene.remove(b.ring);booms.splice(i,1)}}
 for(let i=sparks.length-1;i>=0;i--){const s2=sparks[i];s2.t-=dt;s2.v.y-=14*dt;s2.s.position.addScaledVector(s2.v,dt);
  s2.s.material.opacity=Math.max(0,s2.t*2);if(s2.t<=0){scene.remove(s2.s);sparks.splice(i,1)}}
 for(let i=tracers.length-1;i>=0;i--){const t2=tracers[i];t2.t-=dt;t2.ln.material.opacity=Math.max(0,t2.t/.07*.9);if(t2.t<=0){scene.remove(t2.ln);t2.ln.geometry.dispose();tracers.splice(i,1)}}
 if(!enemies.length&&wave>0){if((nextWave-=dt)<=0){nextWave=3;W[0].res=Math.min(W[0].res+96,240);W[1].res=Math.min(W[1].res+36,90);grenades=Math.min(grenades+2,5);shield=100;spawnWave()}}
 // ambience animation
 for(const py of pyl)py.tip.material.emissiveIntensity=1.6+Math.sin(time*3+py.ph)*.8;
 gun.position.z=-.55+recoil*.06;gun.rotation.x=recoil*.05;gb.scale.z=W[cur].z;
 cam.position.copy(p);cam.rotation.set(pitch,yaw,0);
 const v=$('vig');v.style.opacity=Math.max(0,v.style.opacity-dt*1.5);
 $('sh').style.width=Math.max(0,shield)+'%';$('hp').style.width=Math.max(0,health)+'%';
 $('wave').textContent='Wave '+wave;$('score').textContent=score;$('wn').textContent=W[cur].n;
 $('am').textContent=reloading>0?'RELOADING':`${W[cur].ammo} / ${W[cur].res}`;$('gr').textContent='GRENADES '+grenades;}
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);
 if(started&&!dead&&$('ov').style.display==='none')update(dt);else{time+=dt;for(const py of pyl)py.tip.material.emissiveIntensity=1.6+Math.sin(time*3+py.ph)*.8;}
 ren.render(scene,cam);fpsA+=dt;if(++fpsN>=30){$('fps').textContent=Math.round(fpsN/fpsA)+' FPS';fpsA=fpsN=0}}
spawnWave();loop();
</script></body></html>
